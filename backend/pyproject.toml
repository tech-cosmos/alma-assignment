[project]
name = "alma-backend"
version = "0.1.0"
description = "Lead intake API for an immigration law firm"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "aiosmtplib>=3.0",
    "boto3>=1.34",
]

[project.scripts]
seed = "app.seed:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "moto[s3,ses]>=5.0",
    "aiosmtpd>=1.4",
    "boto3-stubs[s3,ses]>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "N", "W"]
ignore = [
    "B008",  # FastAPI uses call defaults (Depends/Form) by design
    "N818",  # InvalidTransition / InvalidResume are named by docs/PLAN.md section 5
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "tests", "alembic/env.py"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "aiosmtpd.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
testpaths = ["tests"]
